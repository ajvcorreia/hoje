# Weekly dependency PRs, minor and patch updates grouped per ecosystem so they arrive as one PR.
# Major updates stay separate (and are reviewed on their own). Security updates are raised by
# GitHub independently of this schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  # backend/Dockerfile (python and uv base images)
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      docker-backend:
        update-types: [minor, patch]

  # deploy/web.Dockerfile (node, golang, caddy) and any other Dockerfile under deploy/
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      docker-deploy:
        update-types: [minor, patch]

  # compose files under deploy/ (postgres, mailpit, ...)
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      compose:
        update-types: [minor, patch]

  # backend/pyproject.toml + uv.lock
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
